<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Warrior accordion — no framework</title>
    <link rel="stylesheet" href="./warrior-core.css" />
    <link rel="stylesheet" href="./warrior-accordion.css" />
    <style>
      /* Page chrome for this demo only. None of it is part of the library. */
      @font-face {
        font-family: 'Chakra Petch';
        src: url('./fonts/chakra-petch-500.woff2') format('woff2');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: 'Chakra Petch';
        src: url('./fonts/chakra-petch-700.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'IBM Plex Sans';
        src: url('./fonts/ibm-plex-sans.woff2') format('woff2');
        font-weight: 100 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'JetBrains Mono';
        src: url('./fonts/jetbrains-mono.woff2') format('woff2');
        font-weight: 100 800;
        font-display: swap;
      }

      html {
        background: var(--wr-bg);
      }
      body {
        margin: 0;
        padding: 48px 24px;
        display: flex;
        justify-content: center;
        background: var(--wr-bg);
        color: var(--wr-text);
      }
      main {
        width: 100%;
        max-width: 620px;
      }
      h1 {
        font: 700 26px/1.1 'Chakra Petch', system-ui, sans-serif;
        letter-spacing: -0.02em;
        margin: 0;
      }
      p.note {
        font: 400 14px/1.65 'IBM Plex Sans', system-ui, sans-serif;
        color: var(--wr-text-muted);
        margin: 8px 0 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Accordion</h1>
      <p class="note">
        One stylesheet link, one function call, no build step and no framework in
        sight. Toggle a trigger, or use the arrow keys.
      </p>
      <div id="host"></div>
    </main>

    <script src="./accordion.js"></script>
  </body>
</html>
